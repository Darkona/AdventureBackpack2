plugins {
    id 'java'
    id 'idea'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.6'
}

group = mod_group
version = mod_version
base.archivesName = "${archive_name}-${minecraft_version}"

// Gradle runs on any recent JDK; the mod compiles and runs on Java 8 like every 1.7.10 mod
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.AZUL
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The API for addons lives in its own source set (src/api/java, package adventurebackpack.api): it sees Minecraft and
// Forge and never the mod's own classes. The mod depends on its output and its jar carries it, so the mod works with
// that one jar; the same classes also go out alone in adventurebackpack-api-<mc>-<api_version>.jar for addon authors.
sourceSets {
    api
}

dependencies {
    // Minecraft and Forge for the API source set: the same patched Minecraft RetroFuturaGradle gives to main
    apiCompileOnly sourceSets.patchedMc.output
    implementation sourceSets.api.output
}

// adventurebackpack.api.ApiVersion: the value behind AdventureBackpackAPI.getVersion(), written from api_version
def apiVersionDir = layout.buildDirectory.dir('generated/sources/apiVersion')
def generateApiVersion = tasks.register('generateApiVersion') {
    def outDir = apiVersionDir
    def apiVer = api_version
    inputs.property 'apiVersion', apiVer
    outputs.dir outDir
    doLast {
        def f = outDir.get().file('adventurebackpack/api/ApiVersion.java').asFile
        f.parentFile.mkdirs()
        f.text = "package adventurebackpack.api;\n\n/** Generated from api_version in gradle.properties. */\nfinal class ApiVersion\n{\n    static final String VALUE = \"${apiVer}\";\n\n    private ApiVersion()\n    {\n    }\n}\n"
    }
}
sourceSets.api.java.srcDir apiVersionDir
tasks.named('compileApiJava') { dependsOn generateApiVersion }

tasks.named('jar') {
    from sourceSets.api.output
}

// The API-only artifact: classes (reobfuscated by RetroFuturaGradle as reobfApiJar), sources and javadoc. No @Mod, no
// mcmod.info and nothing of com.darkona: it is only for compiling an addon against (compileOnly), never for mods/.
def apiBaseName = "${archive_name}-api-${minecraft_version}"
def apiJar = tasks.register('apiJar', Jar) {
    archiveBaseName = apiBaseName
    archiveVersion = api_version
    archiveClassifier = 'dev'
    from sourceSets.api.output
}
tasks.register('apiSourcesJar', Jar) {
    archiveBaseName = apiBaseName
    archiveVersion = api_version
    archiveClassifier = 'sources'
    dependsOn generateApiVersion
    from sourceSets.api.allJava
}
def apiJavadoc = tasks.register('apiJavadoc', Javadoc) {
    dependsOn generateApiVersion
    source = sourceSets.api.allJava
    classpath = sourceSets.api.compileClasspath
    destinationDir = layout.buildDirectory.dir('docs/apiJavadoc').get().asFile
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}
tasks.register('apiJavadocJar', Jar) {
    archiveBaseName = apiBaseName
    archiveVersion = api_version
    archiveClassifier = 'javadoc'
    from apiJavadoc
}
tasks.named('assemble') {
    dependsOn 'apiSourcesJar', 'apiJavadocJar'
}
// reobfApiJar comes from RetroFuturaGradle's reobf<JarTaskName> task rule: named() makes it, as RFG does for reobfJar
def reobfApiJar = tasks.named('reobfApiJar')
tasks.named('assemble') { dependsOn reobfApiJar }

minecraft {
    mcVersion = minecraft_version
    username = 'Developer'
    injectedTags.put('VERSION', project.version)
    extraRunJvmArguments.add("-ea:${project.group}")
}

// Generates com.darkona.adventurebackpack.Tags with the version, read by ModInfo
tasks.injectTags.configure {
    outputClassName = "${project.group}.Tags"
}

tasks.processResources.configure {
    def projVersion = project.version.toString()
    inputs.property 'version', projVersion
    filesMatching('mcmod.info') {
        expand 'modVersion': projVersion
    }
}

idea {
    module {
        inheritOutputDirs = true
        downloadSources = true
    }
}

// Optional integrations: compiled against, never shipped in the jar and never required at runtime.
// Each one is used only from its bridge in compat/, which runs only when Loader.isModLoaded says the mod is there.
repositories {
    maven {
        name = 'GTNH Maven'
        url = 'https://nexus.gtnewhorizons.com/repository/public/'
        content { includeGroup 'com.github.GTNewHorizons' }
    }
}

dependencies {
    // Baubles Expanded keeps the original Baubles API (baubles.api) and adds baubles.api.expanded
    compileOnly('com.github.GTNewHorizons:Baubles-Expanded:2.2.25-GTNH:dev') { transitive = false }
    // Inventory Tweaks: only its annotations (invtweaks.api.container) on ContainerBackpack and compat/invtweaks
    compileOnly('com.github.GTNewHorizons:inventory-tweaks:1.7.1:dev') { transitive = false }
    // Mouse Tweaks: only its interface, on a window subclass built when the mod is loaded (compat/mousetweaks)
    compileOnly('com.github.GTNewHorizons:MouseTweaks:2.5.4-GTNH:dev') { transitive = false }
}

// Unit tests run on plain JUnit 5 without starting Minecraft: they cover logic that does not touch the game classes
dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The backpack item implements Baubles' IBauble: tests that load it (the placed backpack's NBT) need the class
    testRuntimeOnly('com.github.GTNewHorizons:Baubles-Expanded:2.2.25-GTNH:dev') { transitive = false }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'failed' ; exceptionFormat 'short' }
}

// Development only, off unless -Pgolemdrive is given: puts the GolemDrive 1.7.10 dev jar on the runClient classpath
// for headless visual checks (screenshots, GUIs, camera). It is runtimeOnly, so it never goes into the mod jar,
// the release build ignores it and nothing needs it at runtime. -Pgolemdrive=PATH picks the jar; a bare -Pgolemdrive
// uses libs/golemdrive-dev.jar (libs/ is not tracked).
if (project.hasProperty('golemdrive')) {
    def golemdriveJar = project.property('golemdrive') ? file(project.property('golemdrive')) : file('libs/golemdrive-dev.jar')
    dependencies {
        runtimeOnly files(golemdriveJar)
    }
    minecraft {
        // GolemDrive's input coremod: in dev runs FML finds it only through this property
        extraRunJvmArguments.add('-Dfml.coreMods.load=com.darkona.golemdrive.mc.input.InputPlugin')
    }
}

// Development only, off unless -PdevMods is given: puts NEI, Baubles Expanded, Inventory Tweaks and Mouse Tweaks on the
// runClient classpath to test compatibility. They are runtimeOnly, so they never go into the mod jar, the normal
// compilation or the release; without the property the build is unchanged. Their own dependencies (GTNHLib, UniMixins,
// CodeChickenCore...) come in transitively from the GTNH Maven.
if (project.hasProperty('devMods')) {
    repositories {
        maven {
            name = 'GTNH Maven (dev mods dependencies)'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            content { excludeGroup 'com.github.GTNewHorizons' }
        }
    }
    dependencies {
        runtimeOnly 'com.github.GTNewHorizons:GTNHLib:0.11.54:dev'
        runtimeOnly 'com.github.GTNewHorizons:NotEnoughItems:2.8.161-GTNH:dev'
        runtimeOnly 'com.github.GTNewHorizons:Baubles-Expanded:2.2.25-GTNH:dev'
        runtimeOnly 'com.github.GTNewHorizons:inventory-tweaks:1.7.1:dev'
        runtimeOnly 'com.github.GTNewHorizons:MouseTweaks:2.5.4-GTNH:dev'
    }
    // NEI brings its own (newer) CodeChickenLib, and the copies of codechicken.lib in this repo would shadow it and break
    // NEI's rendering (NoSuchMethodError CCRenderState.instance()). For this run only, the mod goes in as a copy of the
    // dev jar without codechicken/**, so the mod uses NEI's CodeChickenLib. The real jar is not touched.
    def devRunJar = tasks.register('devRunJar', Jar) {
        archiveClassifier = 'devrun'
        dependsOn tasks.named('jar')
        from(provider { zipTree(tasks.named('jar').get().archiveFile) }) { exclude 'codechicken/**' }
    }
    tasks.named('runClient') {
        dependsOn devRunJar
        classpath = classpath.minus(files(tasks.named('jar').get().archiveFile)).plus(files(devRunJar.get().archiveFile))
    }
}
