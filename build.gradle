plugins {
    id 'java'
    id 'idea'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.6'
}

group = mod_group
version = mod_version
base.archivesName = "${archive_name}-${minecraft_version}"

// Gradle runs on any recent JDK; the mod compiles and runs on Java 8 like every 1.7.10 mod
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.AZUL
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mcVersion = minecraft_version
    username = 'Developer'
    injectedTags.put('VERSION', project.version)
    extraRunJvmArguments.add("-ea:${project.group}")
}

// Generates com.darkona.adventurebackpack.Tags with the version, read by ModInfo
tasks.injectTags.configure {
    outputClassName = "${project.group}.Tags"
}

tasks.processResources.configure {
    def projVersion = project.version.toString()
    inputs.property 'version', projVersion
    filesMatching('mcmod.info') {
        expand 'modVersion': projVersion
    }
}

idea {
    module {
        inheritOutputDirs = true
        downloadSources = true
    }
}

// Optional integrations: compiled against, never shipped in the jar and never required at runtime.
// Each one is used only from its bridge in compat/, which runs only when Loader.isModLoaded says the mod is there.
repositories {
    maven {
        name = 'GTNH Maven'
        url = 'https://nexus.gtnewhorizons.com/repository/public/'
        content { includeGroup 'com.github.GTNewHorizons' }
    }
}

dependencies {
    // Baubles Expanded keeps the original Baubles API (baubles.api) and adds baubles.api.expanded
    compileOnly('com.github.GTNewHorizons:Baubles-Expanded:2.2.25-GTNH:dev') { transitive = false }
}

// Unit tests run on plain JUnit 5 without starting Minecraft: they cover logic that does not touch the game classes
dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'failed' ; exceptionFormat 'short' }
}
